[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acme-inc-core"
version = "0.1.0"
description = "Convention-heavy image-processing library on scikit-image; clean-house demo."
requires-python = ">=3.10"
dependencies = [
    "scikit-image>=0.22",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["core", "wrapper"]
